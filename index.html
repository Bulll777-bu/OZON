<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OZON Logo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #005bff; /* фирменный синий Ozon */
    }

    .logo {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 120px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -2px;
      text-transform: uppercase;
      line-height: 1;
      user-select: none;
    }
